[[injection]]
id = "add-world-preset"
target = "horizon_world::worldgen::overrides::WorldgenOverrides::apply"
kind = "RETURN"
helper = "hooks/add_preset.rs"
bindings = [
  { name = "bundle", ty = "&str", value = "bundle" },
  { name = "value", ty = "BTreeMap<String, String>", value = "$value" },
]

[[injection]]
id = "terraforged-world-generator"
target = "horizon_world::worldgen::generator::OverworldGenerator::for_world"
kind = "OVERWRITE"
helper = "hooks/for_world.rs"
bindings = [
  { name = "data", ty = "Arc<GeneratorData>", value = "data" },
  { name = "seed", ty = "i64", value = "seed" },
  { name = "preset", ty = "&str", value = "preset" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "structures", ty = "bool", value = "structures" },
]

[[injection]]
id = "terraforged-dimension-generator"
target = "horizon_world::worldgen::generator::OverworldGenerator::for_dimension"
kind = "OVERWRITE"
helper = "hooks/for_dimension.rs"
bindings = [
  { name = "data", ty = "Arc<GeneratorData>", value = "data" },
  { name = "seed", ty = "i64", value = "seed" },
  { name = "preset", ty = "&str", value = "preset" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "terraforged-decoration-preload"
target = "horizon_world::worldgen::generator::GeneratorData::prepare_decoration"
kind = "HEAD"
cancellable = true
helper = "hooks/prepare_decoration.rs"
bindings = [
  { name = "data", ty = "&Arc<GeneratorData>", value = "self" },
  { name = "preset", ty = "&str", value = "preset" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

